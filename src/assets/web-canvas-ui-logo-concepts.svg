  <text x="790" y="506" fill="#53627A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">明快、有亲和力，强调丰富的 UI 组件</text>
  <text x="790" y="534" fill="#8490A2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">适合示例页、社媒宣传和互动演示</text>

  <rect x="48" y="650" width="1104" height="238" rx="24" fill="#fff"/>
  <text x="80" y="690" fill="#315B91" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">03 / PROFESSIONAL PLATFORM</text>
  <rect x="82" y="716" width="116" height="116" rx="25" fill="#14223B"/>
  <rect x="101" y="737" width="78" height="74" rx="9" fill="none" stroke="#E7F0FF" stroke-width="3.5"/>
  <path d="M102 755h76" stroke="#E7F0FF" stroke-opacity=".65" stroke-width="2.5"/>
  <circle cx="112" cy="746" r="2.5" fill="#63D6CC"/><circle cx="121" cy="746" r="2.5" fill="#80AFFF"/><circle cx="130" cy="746" r="2.5" fill="#DDE8FA"/>
  <path d="M112 795v-18h16v18zm31 0v-28h21v28z" fill="#3977D5"/>
  <path d="M128 786h15" stroke="#63D6CC" stroke-linecap="round" stroke-width="3.5"/>
  <circle cx="128" cy="786" r="4" fill="#63D6CC"/><circle cx="143" cy="786" r="4" fill="#63D6CC"/>
  <text x="232" y="776" fill="#14223B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-1">Web Canvas UI</text>
  <text x="235" y="807" fill="#65728A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="1.8">ONE CANVAS. FOUR FRAMEWORKS.</text>
  <text x="790" y="766" fill="#53627A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">稳重、规整，强调多框架共用的渲染引擎</text>
  <text x="790" y="794" fill="#8490A2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">适合正式文档、项目介绍和技术演讲</text>
