<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Web Canvas UI logo concepts</title>
  <desc id="desc">Three original logo directions: minimal technology, bright developer tool, and professional enterprise.</desc>
  <rect width="1200" height="940" fill="#F4F7FB"/>
  <text x="64" y="70" fill="#17233D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">WEB CANVAS UI</text>
  <text x="64" y="99" fill="#718096" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1.6">THREE ORIGINAL BRAND DIRECTIONS</text>

  <rect x="48" y="130" width="1104" height="238" rx="24" fill="#fff"/>
  <text x="80" y="170" fill="#3C69D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">01 / MINIMAL TECHNOLOGY</text>
  <rect x="82" y="196" width="116" height="116" rx="29" fill="#4B73F0"/>
  <rect x="105" y="219" width="70" height="70" rx="11" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="m117 273 17-18 13 10 19-25" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
  <circle cx="117" cy="273" r="5" fill="#fff"/><circle cx="134" cy="255" r="5" fill="#BDEAFF"/><circle cx="147" cy="265" r="5" fill="#fff"/><circle cx="166" cy="240" r="5" fill="#BDEAFF"/>
  <text x="232" y="256" fill="#17233D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-1">Web Canvas UI</text>
  <text x="235" y="287" fill="#65728A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="1.8">DRAW INTERFACES IN CODE</text>
  <text x="790" y="246" fill="#53627A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">清爽、轻量，突出 Canvas 坐标与绘制路径</text>
  <text x="790" y="274" fill="#8490A2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">适合产品主页、文档站和开发者工具</text>

  <rect x="48" y="390" width="1104" height="238" rx="24" fill="#fff"/>
  <text x="80" y="430" fill="#E26D59" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">02 / BRIGHT DEVELOPER TOOL</text>
  <rect x="82" y="456" width="116" height="116" rx="32" fill="#FF7885"/>
  <rect x="101" y="478" width="78" height="66" rx="12" fill="#fff"/>
  <rect x="110" y="487" width="29" height="21" rx="6" fill="#FFD65A"/>
  <circle cx="159" cy="498" r="10" fill="#57D8C1"/>
  <rect x="110" y="516" width="60" height="8" rx="4" fill="#E5E9F5"/>
  <rect x="110" y="530" width="39" height="7" rx="3.5" fill="#D9DDF0"/>
  <path d="m166 519 9 17-7-3-4 7-4-2 4-7-6-2z" fill="#263250" stroke="#fff" stroke-width="2"/>
